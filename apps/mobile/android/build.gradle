buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.0"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }
}

// Fix for legacy Android Support Library to AndroidX mapping
allprojects {
    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'com.android.support') {
                    if (details.requested.name == 'appcompat-v7') {
                        details.useTarget("androidx.appcompat:appcompat:1.6.1")
                    } else if (details.requested.name == 'support-v4') {
                        details.useTarget("androidx.legacy:legacy-support-v4:1.0.0")
                    } else if (details.requested.name == 'recyclerview-v7') {
                        details.useTarget("androidx.recyclerview:recyclerview:1.3.2")
                    }
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
